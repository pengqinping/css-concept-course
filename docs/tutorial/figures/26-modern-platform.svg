<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 545" width="800" height="545" font-family="sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="545" fill="#F7F8F4"/>

  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">三条替换示意：把每帧计算交给浏览器</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#4A5544">动画代码没变，变的只是坐标、进度与快照由谁来算</text>

  <!-- ① 锚点定位 -->
  <rect x="30" y="85" width="740" height="110" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="112" font-size="14" font-weight="700" fill="#2F6F4F">① 锚点定位 · 坐标来自另一元素</text>
  <rect x="56" y="130" width="150" height="40" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="131" y="155" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">按钮 anchor-name: --a</text>
  <line x1="208" y1="150" x2="428" y2="150" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <rect x="430" y="130" width="200" height="40" rx="4" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="530" y="155" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">浮层 position-anchor</text>
  <text x="650" y="147" font-size="12" fill="#4A5544">坐标来自</text>
  <text x="650" y="163" font-size="12" fill="#4A5544">另一元素</text>
  <text x="56" y="188" font-size="12" fill="#B26B00" font-family="monospace">替掉 JS 每帧读 getBoundingClientRect()</text>

  <!-- ② 滚动驱动 -->
  <rect x="30" y="210" width="740" height="110" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="237" font-size="14" font-weight="700" fill="#2F6F4F">② 滚动驱动动画 · 时间轴换成滚动进度</text>
  <text x="60" y="270" font-size="12" fill="#B26B00">时间</text>
  <line x1="100" y1="266" x2="690" y2="266" stroke="#B26B00" stroke-width="2" marker-end="url(#arAmber)"/>
  <line x1="250" y1="262" x2="250" y2="270" stroke="#B26B00" stroke-width="1"/>
  <line x1="400" y1="262" x2="400" y2="270" stroke="#B26B00" stroke-width="1"/>
  <line x1="550" y1="262" x2="550" y2="270" stroke="#B26B00" stroke-width="1"/>
  <text x="700" y="270" font-size="12" fill="#B26B00">duration</text>
  <text x="60" y="304" font-size="12" fill="#2F6F4F">滚动</text>
  <line x1="100" y1="300" x2="690" y2="300" stroke="#2F6F4F" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="250" y1="296" x2="250" y2="304" stroke="#2F6F4F" stroke-width="1"/>
  <line x1="400" y1="296" x2="400" y2="304" stroke="#2F6F4F" stroke-width="1"/>
  <line x1="550" y1="296" x2="550" y2="304" stroke="#2F6F4F" stroke-width="1"/>
  <text x="700" y="304" font-size="12" fill="#2F6F4F">100%</text>
  <line x1="400" y1="274" x2="400" y2="294" stroke="#2F6F4F" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arGreen)"/>
  <text x="420" y="288" font-size="12" fill="#2F6F4F">换掉驱动源，不换 @keyframes</text>
  <text x="100" y="316" font-size="12" fill="#2F6F4F">停手就停，往回滚就倒放</text>

  <!-- ③ 视图过渡 -->
  <rect x="30" y="335" width="740" height="110" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="362" font-size="14" font-weight="700" fill="#2F6F4F">③ 视图过渡 · 旧快照 → 新快照桥接</text>
  <rect x="56" y="380" width="190" height="48" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="151" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A1B">旧快照</text>
  <text x="151" y="418" text-anchor="middle" font-size="12" fill="#4A5544" font-family="monospace">::view-transition-old</text>
  <rect x="554" y="380" width="190" height="48" rx="4" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="649" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A1B">新快照</text>
  <text x="649" y="418" text-anchor="middle" font-size="12" fill="#4A5544" font-family="monospace">::view-transition-new</text>
  <line x1="248" y1="404" x2="552" y2="404" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <text x="400" y="397" text-anchor="middle" font-size="12" fill="#2F6F4F" font-family="monospace">startViewTransition()</text>
  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#4A5544">DOM 变化由两张快照桥接</text>

  <rect x="30" y="460" width="740" height="70" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">共同前提：基础状态独立可用 + 能力检测 + 明确回退</text>
  <text x="400" y="507" text-anchor="middle" font-size="12" fill="#4A5544">检测入口：@supports(anchor-name) / @supports(animation-timeline: view()) / “startViewTransition” in document</text>
  <text x="400" y="525" text-anchor="middle" font-size="12" fill="#4A5544">只验证语法，不保证行为完整；不支持时内容仍可读、任务仍可完成</text>
</svg>
