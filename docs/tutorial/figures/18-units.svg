<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5544"/>
    </marker>
  </defs>

  <rect width="800" height="620" fill="#F7F8F4"/>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1F2A1B">单位参照物地图：每个长度单位都自带一个参照物</text>
  <text x="40" y="58" font-size="13" fill="#4A5544">先找参照物，再做乘法；同一个数字配不同参照物，算出的像素完全不同</text>

  <!-- 向外连线：中心问题 → 各参照物 -->
  <line x1="338" y1="263" x2="250" y2="196" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="463" y1="264" x2="550" y2="200" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="478" y1="310" x2="615" y2="310" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="322" y1="310" x2="195" y2="310" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="463" y1="357" x2="550" y2="422" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="338" y1="358" x2="260" y2="418" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>

  <!-- 中心问题 -->
  <circle cx="400" cy="310" r="78" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="2"/>
  <text x="400" y="304" font-size="16" font-weight="bold" fill="#1F2A1B" text-anchor="middle">这个长度</text>
  <text x="400" y="328" font-size="16" font-weight="bold" fill="#1F2A1B" text-anchor="middle">以谁为准？</text>

  <!-- rem → 根字号 -->
  <rect x="70" y="128" width="180" height="68" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="160" y="156" font-size="17" font-weight="bold" fill="#B26B00" text-anchor="middle">rem</text>
  <text x="160" y="179" font-size="13" fill="#1F2A1B" text-anchor="middle">根字号 html</text>

  <!-- em → 父级 / 自身字号 -->
  <rect x="550" y="122" width="200" height="78" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="650" y="150" font-size="17" font-weight="bold" fill="#B26B00" text-anchor="middle">em</text>
  <text x="650" y="172" font-size="13" fill="#1F2A1B" text-anchor="middle">父级 / 自身字号</text>
  <text x="650" y="192" font-size="12" fill="#4A5544" text-anchor="middle">font-size 特例看父级</text>

  <!-- % → 包含块 -->
  <rect x="615" y="276" width="150" height="68" rx="5" fill="#FFFDF7" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="690" y="307" font-size="17" font-weight="bold" fill="#2F6F4F" text-anchor="middle">%</text>
  <text x="690" y="330" font-size="13" fill="#1F2A1B" text-anchor="middle">包含块对应维度</text>

  <!-- ch → 0 字宽 -->
  <rect x="35" y="276" width="160" height="68" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="115" y="307" font-size="17" font-weight="bold" fill="#B26B00" text-anchor="middle">ch</text>
  <text x="115" y="330" font-size="13" fill="#1F2A1B" text-anchor="middle">字符 0 宽度</text>

  <!-- vw → 视口 -->
  <rect x="550" y="422" width="180" height="68" rx="5" fill="#FFFDF7" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="640" y="458" font-size="17" font-weight="bold" fill="#2F6F4F" text-anchor="middle">vw</text>
  <text x="640" y="480" font-size="13" fill="#1F2A1B" text-anchor="middle">视口宽（vh 视高）</text>

  <!-- cqw → 查询容器 -->
  <rect x="70" y="418" width="190" height="76" rx="5" fill="#FFFDF7" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="165" y="450" font-size="17" font-weight="bold" fill="#2F6F4F" text-anchor="middle">cqw</text>
  <text x="165" y="472" font-size="13" fill="#1F2A1B" text-anchor="middle">查询容器宽</text>
  <text x="165" y="490" font-size="12" fill="#4A5544" text-anchor="middle">cqi 行内轴</text>

  <!-- 角落：clamp -->
  <text x="40" y="525" font-size="12" fill="#4A5544">琥珀＝字号相关参照　绿＝盒 / 视口相关参照</text>
  <rect x="430" y="540" width="330" height="56" rx="5" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.5"/>
  <text x="595" y="564" font-size="15" font-weight="bold" fill="#1F2A1B" text-anchor="middle">clamp(下限, 偏好值, 上限)</text>
  <text x="595" y="584" font-size="12" fill="#4A5544" text-anchor="middle">= max(MIN, min(PREFERRED, MAX))</text>
</svg>
