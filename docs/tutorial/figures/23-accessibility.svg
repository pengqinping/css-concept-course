<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 585" width="800" height="585" font-family="sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="585" fill="#F7F8F4"/>

  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">渐进增强四层台阶：下层是底线，上层是增强</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#4A5544">上一层只有在下一层成立时才有意义；每层标出它塌掉时的后果</text>

  <rect x="40" y="380" width="170" height="130" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="54" y="408" font-size="15" font-weight="700" fill="#1F2A1B">① 语义与键盘</text>
  <text x="54" y="430" font-size="12" fill="#4A5544" font-family="monospace">button / nav / main</text>
  <text x="54" y="450" font-size="12" fill="#4A5544">DOM 顺序 = Tab 顺序</text>
  <line x1="54" y1="464" x2="196" y2="464" stroke="#C8CEBF" stroke-width="1"/>
  <text x="54" y="484" font-size="12" fill="#B26B00">失败：读屏与键盘</text>
  <text x="54" y="502" font-size="12" fill="#B26B00">都走不通</text>

  <rect x="215" y="300" width="170" height="210" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="229" y="328" font-size="15" font-weight="700" fill="#1F2A1B">② 焦点与对比度</text>
  <text x="229" y="350" font-size="12" fill="#4A5544" font-family="monospace">:focus-visible · 对比度</text>
  <text x="229" y="370" font-size="12" fill="#4A5544">outline 不删，按时机显示</text>
  <text x="229" y="410" font-size="12" fill="#4A5544">门槛按最终合成后的颜色算</text>
  <line x1="229" y1="464" x2="371" y2="464" stroke="#C8CEBF" stroke-width="1"/>
  <text x="229" y="484" font-size="12" fill="#B26B00">失败：焦点看不见、</text>
  <text x="229" y="502" font-size="12" fill="#B26B00">浅灰字读不动</text>

  <rect x="390" y="220" width="170" height="290" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="404" y="248" font-size="15" font-weight="700" fill="#1F2A1B">③ 用户偏好</text>
  <text x="404" y="270" font-size="12" fill="#4A5544" font-family="monospace">reduced-motion</text>
  <text x="404" y="290" font-size="12" fill="#4A5544">forced-colors 用系统色</text>
  <text x="404" y="360" font-size="12" fill="#4A5544">减弱动画 ≠ 抹掉反馈</text>
  <text x="404" y="390" font-size="12" fill="#4A5544">强制颜色下改用系统色</text>
  <line x1="404" y1="464" x2="546" y2="464" stroke="#C8CEBF" stroke-width="1"/>
  <text x="404" y="484" font-size="12" fill="#B26B00">失败：动画致晕、高对比</text>
  <text x="404" y="502" font-size="12" fill="#B26B00">下按钮消失</text>

  <rect x="565" y="140" width="170" height="370" fill="#FFFDF7" stroke="#2F6F4F" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="579" y="168" font-size="15" font-weight="700" fill="#1F2A1B">④ 能力增强</text>
  <text x="579" y="190" font-size="12" fill="#4A5544" font-family="monospace">@supports 分层</text>
  <text x="579" y="210" font-size="12" fill="#4A5544">Flex 基础 → Grid 增强</text>
  <text x="579" y="280" font-size="12" fill="#4A5544">基础可用在前，增强在后</text>
  <text x="579" y="320" font-size="12" fill="#4A5544">@supports 只验证语法，</text>
  <text x="579" y="340" font-size="12" fill="#4A5544">不保证行为完整</text>
  <text x="579" y="382" font-size="12" fill="#2F6F4F">可拆</text>
  <line x1="579" y1="464" x2="721" y2="464" stroke="#C8CEBF" stroke-width="1"/>
  <text x="579" y="484" font-size="12" fill="#2F6F4F">拆掉：下面三层仍可用</text>
  <text x="579" y="502" font-size="12" fill="#2F6F4F">功能不丢</text>

  <line x1="200" y1="372" x2="220" y2="308" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <line x1="375" y1="292" x2="395" y2="228" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <line x1="550" y1="212" x2="570" y2="148" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>

  <rect x="40" y="528" width="720" height="46" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="551" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">下面三层是底线，最上一层永远可拆</text>
  <text x="400" y="569" text-anchor="middle" font-size="12" fill="#4A5544">拆掉焦点环去调圆角，等于把地基拆了来装修屋顶</text>
</svg>
