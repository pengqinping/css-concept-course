<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="560" fill="#F7F8F4"/>

  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">两种边框模型剖面：线归谁，表头管谁</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#4A5544">同样写 1px，线与线之间差一倍；表头关联来自 th + scope，不来自画出来的线</text>

  <!-- 左：separate -->
  <rect x="30" y="85" width="360" height="210" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="112" font-size="15" font-weight="700" fill="#B26B00">separate（默认）· 双线 + 间距</text>
  <rect x="58" y="140" width="120" height="80" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.5"/>
  <rect x="222" y="140" width="120" height="80" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.5"/>
  <text x="200" y="122" text-anchor="middle" font-size="12" fill="#B26B00">border-spacing</text>
  <line x1="200" y1="127" x2="200" y2="137" stroke="#B26B00" stroke-width="1" marker-end="url(#arAmber)"/>
  <line x1="178" y1="246" x2="178" y2="223" stroke="#B26B00" stroke-width="1" marker-end="url(#arAmber)"/>
  <line x1="222" y1="246" x2="222" y2="223" stroke="#B26B00" stroke-width="1" marker-end="url(#arAmber)"/>
  <text x="200" y="263" text-anchor="middle" font-size="12" fill="#B26B00">1px + 1px</text>
  <text x="46" y="284" font-size="12" fill="#4A5544">两条独立边框并排＝视觉 2px；圆角正常</text>

  <!-- 右：collapse -->
  <rect x="410" y="85" width="360" height="210" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="426" y="112" font-size="15" font-weight="700" fill="#2F6F4F">collapse · 共享单线</text>
  <rect x="438" y="140" width="115" height="80" fill="#E8F1E9"/>
  <rect x="553" y="140" width="115" height="80" fill="#E8F1E9"/>
  <rect x="438" y="140" width="230" height="80" fill="none" stroke="#2F6F4F" stroke-width="2"/>
  <line x1="553" y1="140" x2="553" y2="220" stroke="#2F6F4F" stroke-width="2"/>
  <line x1="553" y1="246" x2="553" y2="223" stroke="#2F6F4F" stroke-width="1" marker-end="url(#arGreen)"/>
  <text x="553" y="263" text-anchor="middle" font-size="12" fill="#2F6F4F">一条 1px</text>
  <text x="426" y="284" font-size="12" fill="#4A5544">border-spacing 无效；先淘汰 hidden → 比宽度 → 比样式</text>

  <!-- 下：th scope 表头关联 -->
  <rect x="30" y="310" width="740" height="230" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="338" font-size="15" font-weight="700" fill="#1F2A1B">表头关联：th + scope 建立“表头—数据”对应</text>

  <rect x="150" y="355" width="130" height="42" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="215" y="382" text-anchor="middle" font-size="12" fill="#1F2A1B">订单号 · col</text>
  <rect x="280" y="355" width="130" height="42" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="345" y="382" text-anchor="middle" font-size="12" fill="#1F2A1B">金额 · col</text>
  <rect x="60" y="415" width="90" height="42" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="105" y="442" text-anchor="middle" font-size="12" fill="#1F2A1B">#1042 · row</text>
  <rect x="150" y="415" width="130" height="42" fill="#FFFFFF" stroke="#C8CEBF" stroke-width="1"/>
  <rect x="280" y="415" width="130" height="42" fill="#FFFFFF" stroke="#C8CEBF" stroke-width="1"/>
  <text x="345" y="442" text-anchor="middle" font-size="12" fill="#1F2A1B">¥ 328.00</text>

  <line x1="345" y1="399" x2="345" y2="413" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <text x="425" y="409" font-size="12" fill="#2F6F4F">scope=col：整列关联</text>
  <line x1="152" y1="436" x2="278" y2="436" stroke="#B26B00" stroke-width="1.2" marker-end="url(#arAmber)"/>
  <text x="170" y="477" font-size="12" fill="#B26B00">scope=row：整行关联</text>

  <text x="470" y="380" font-size="12" fill="#4A5544">读到 ¥ 328.00 时，</text>
  <text x="470" y="402" font-size="12" fill="#4A5544">读屏软件同时念出“金额”；</text>
  <text x="470" y="432" font-size="12" fill="#B26B00">CSS 画的线不进可访问性树，</text>
  <text x="470" y="454" font-size="12" fill="#B26B00">div 画成网格也没有表头关联。</text>
  <text x="46" y="522" font-size="12" fill="#4A5544">结构由 table / th scope / caption 决定；border-collapse 与 table-layout 只改算法参数。</text>
</svg>
