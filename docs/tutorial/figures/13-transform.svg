<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" width="800" height="455" font-family="sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="455" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">transform：布局盒不变，坐标系改变</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#4A5544">布局结束后换掉局部坐标系；兄弟不让位，但后代参照与层叠归属会变</text>

  <rect x="30" y="92" width="370" height="283" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="118" font-size="15" font-weight="700" fill="#1F2A1B">① 布局盒不变，坐标系改变</text>

  <rect x="80" y="160" width="160" height="80" fill="none" stroke="#8A9384" stroke-width="1.2" stroke-dasharray="5,3"/>
  <rect x="80" y="160" width="160" height="80" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.5" transform="rotate(30 160 200)"/>
  <circle cx="160" cy="200" r="5" fill="#B26B00"/>
  <line x1="160" y1="205" x2="160" y2="290" stroke="#B26B00" stroke-width="1"/>
  <text x="160" y="304" text-anchor="middle" font-size="12" fill="#A86A00">transform-origin 支点（50% 50%）</text>
  <path d="M 200 170 Q 216 200 188 230" fill="none" stroke="#B26B00" stroke-width="1.2" marker-end="url(#arAmber)"/>
  <text x="272" y="170" font-size="12" fill="#2F6F4F">视觉外观：rotate(30deg)</text>

  <rect x="305" y="185" width="60" height="40" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="335" y="244" text-anchor="middle" font-size="12" fill="#4A5544">兄弟不让位</text>
  <text x="46" y="345" font-size="12" fill="#4A5544">虚线＝布局盒（不变），实线＝外观（改变），支点决定绕哪儿转</text>

  <rect x="420" y="92" width="350" height="283" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="436" y="118" font-size="15" font-weight="700" fill="#1F2A1B">② 函数从右往左应用（矩阵乘法）</text>

  <text x="436" y="150" font-size="14" fill="#1F2A1B" font-family="monospace">rotate(30deg) translateX(100px)</text>
  <rect x="436" y="160" width="140" height="28" rx="3" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="506" y="179" text-anchor="middle" font-size="13" fill="#4A5544" font-family="monospace">rotate(30deg)</text>
  <rect x="590" y="160" width="160" height="28" rx="3" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="670" y="179" text-anchor="middle" font-size="13" fill="#2F6F4F" font-family="monospace">translateX(100px)</text>
  <line x1="740" y1="202" x2="440" y2="202" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <text x="590" y="220" text-anchor="middle" font-size="12" fill="#4A5544">作用顺序：右 → 左（最右项先作用）</text>
  <text x="436" y="244" font-size="13" font-weight="700" fill="#1F2A1B">落点约 (86.6px, 50px)：平移向量也被旋转</text>

  <text x="436" y="278" font-size="14" fill="#1F2A1B" font-family="monospace">translateX(100px) rotate(30deg)</text>
  <rect x="436" y="288" width="160" height="28" rx="3" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="516" y="307" text-anchor="middle" font-size="13" fill="#4A5544" font-family="monospace">translateX(100px)</text>
  <rect x="610" y="288" width="140" height="28" rx="3" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="680" y="307" text-anchor="middle" font-size="13" fill="#2F6F4F" font-family="monospace">rotate(30deg)</text>
  <line x1="740" y1="330" x2="440" y2="330" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <text x="590" y="348" text-anchor="middle" font-size="12" fill="#4A5544">最右项 rotate 先作用，再沿屏幕 X 轴平移</text>
  <text x="436" y="368" font-size="13" font-weight="700" fill="#1F2A1B">落点 (100px, 0)：平移方向不跟着转</text>

  <rect x="40" y="395" width="720" height="46" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">判断顺序：布局盒有没有变（没有）→ 后代参照有没有变（有）→ 层叠归属有没有变（有）</text>
  <text x="400" y="434" text-anchor="middle" font-size="12" fill="#4A5544">非 none 的 transform 会成为 fixed/absolute 后代的包含块并创建层叠上下文，scale(1) 也一样</text>
</svg>
