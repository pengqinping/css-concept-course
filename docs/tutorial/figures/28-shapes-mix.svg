<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" font-family="sans-serif">
  <defs>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="570" fill="#F7F8F4"/>

  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">四个属性作用于四个对象：认错对象就白写</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#4A5544">内容流、行盒避让区、合成边界、可见像素集合——不是同一种“外观”</text>

  <!-- 多列 -->
  <rect x="30" y="85" width="355" height="200" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="112" font-size="15" font-weight="700" fill="#2F6F4F">多列 → 内容流</text>
  <rect x="46" y="130" width="320" height="70" fill="#F7F8F4" stroke="#C8CEBF" stroke-width="1"/>
  <rect x="56" y="138" width="100" height="54" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <rect x="62" y="146" width="88" height="5" fill="#6B7F5B"/>
  <rect x="62" y="158" width="80" height="5" fill="#6B7F5B"/>
  <rect x="62" y="170" width="86" height="5" fill="#6B7F5B"/>
  <rect x="62" y="182" width="60" height="5" fill="#6B7F5B"/>
  <rect x="166" y="138" width="100" height="54" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <rect x="172" y="146" width="86" height="5" fill="#6B7F5B"/>
  <rect x="172" y="158" width="90" height="5" fill="#6B7F5B"/>
  <rect x="172" y="170" width="74" height="5" fill="#6B7F5B"/>
  <rect x="172" y="182" width="88" height="5" fill="#6B7F5B"/>
  <rect x="276" y="138" width="82" height="54" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <rect x="282" y="146" width="70" height="5" fill="#6B7F5B"/>
  <rect x="282" y="158" width="66" height="5" fill="#6B7F5B"/>
  <rect x="282" y="170" width="72" height="5" fill="#6B7F5B"/>
  <rect x="282" y="182" width="58" height="5" fill="#6B7F5B"/>
  <line x1="162" y1="138" x2="162" y2="192" stroke="#2F6F4F" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="272" y1="138" x2="272" y2="192" stroke="#2F6F4F" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="46" y="222" font-size="12" fill="#4A5544">一条连续流被分到各栏；DOM 顺序不变，栏高自动平衡</text>

  <!-- shape-outside -->
  <rect x="415" y="85" width="355" height="200" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="431" y="112" font-size="15" font-weight="700" fill="#2F6F4F">shape-outside → 行盒避让区</text>
  <circle cx="470" cy="170" r="34" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.5"/>
  <rect x="430" y="134" width="80" height="72" fill="none" stroke="#B26B00" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="520" y="146" width="220" height="6" fill="#6B7F5B"/>
  <rect x="520" y="160" width="200" height="6" fill="#6B7F5B"/>
  <rect x="520" y="174" width="210" height="6" fill="#6B7F5B"/>
  <rect x="520" y="188" width="180" height="6" fill="#6B7F5B"/>
  <rect x="430" y="214" width="300" height="6" fill="#6B7F5B"/>
  <rect x="430" y="226" width="260" height="6" fill="#6B7F5B"/>
  <text x="431" y="250" font-size="12" fill="#B26B00">虚框＝只写 border-radius 时的矩形避让</text>
  <text x="431" y="270" font-size="12" fill="#4A5544">行盒沿圆边走；不裁剪图片本身，需配合 float</text>

  <!-- isolation -->
  <rect x="30" y="315" width="355" height="200" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="342" font-size="15" font-weight="700" fill="#2F6F4F">isolation → 合成边界</text>
  <rect x="46" y="358" width="320" height="110" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="56" y="376" font-size="12" fill="#B26B00">页面背景（外部 backdrop）</text>
  <line x1="60" y1="432" x2="88" y2="432" stroke="#B26B00" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arAmber)"/>
  <rect x="90" y="384" width="230" height="72" fill="#FFFFFF" stroke="#2F6F4F" stroke-width="2"/>
  <text x="100" y="402" font-size="12" fill="#2F6F4F">isolation: isolate 边界</text>
  <rect x="100" y="410" width="110" height="38" fill="#E8F1E9" stroke="none"/>
  <text x="110" y="434" font-size="12" fill="#4A5544">卡片背景</text>
  <rect x="220" y="410" width="88" height="38" fill="#FFFDF7" stroke="#2F6F4F" stroke-width="1"/>
  <text x="264" y="434" text-anchor="middle" font-size="12" fill="#1F2A1B">图片(乘)</text>
  <text x="46" y="492" font-size="12" fill="#4A5544">自己不混色，只画一条线：决定和谁混、外部只看到合成结果</text>

  <!-- clip-path / mask -->
  <rect x="415" y="315" width="355" height="200" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="431" y="342" font-size="15" font-weight="700" fill="#2F6F4F">clip-path / mask → 可见集合</text>
  <rect x="431" y="358" width="155" height="80" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <rect x="439" y="366" width="62" height="64" fill="#FFFFFF" stroke="none"/>
  <rect x="507" y="366" width="70" height="64" fill="none" stroke="#B26B00" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="505" y1="366" x2="505" y2="430" stroke="#2F6F4F" stroke-width="2"/>
  <text x="508" y="455" text-anchor="middle" font-size="12" fill="#4A5544">clip-path 硬边</text>
  <rect x="600" y="358" width="155" height="80" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <rect x="608" y="366" width="8" height="64" fill="#2F6F4F"/>
  <rect x="620" y="366" width="8" height="56" fill="#2F6F4F"/>
  <rect x="632" y="366" width="8" height="48" fill="#2F6F4F"/>
  <rect x="644" y="366" width="8" height="40" fill="#2F6F4F"/>
  <rect x="656" y="366" width="8" height="32" fill="#2F6F4F"/>
  <rect x="668" y="366" width="8" height="24" fill="#2F6F4F"/>
  <rect x="680" y="366" width="8" height="16" fill="#2F6F4F"/>
  <rect x="692" y="366" width="8" height="8" fill="#2F6F4F"/>
  <text x="677" y="455" text-anchor="middle" font-size="12" fill="#4A5544">mask 读 alpha 软边</text>
  <text x="431" y="492" font-size="12" fill="#4A5544">clip-path 改命中区域；mask 被遮处仍可点击</text>

  <rect x="30" y="528" width="740" height="36" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="552" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">内容流 / 行盒避让区 / 合成组 / 可见像素集合：四件事作用于四个不同对象</text>
</svg>
