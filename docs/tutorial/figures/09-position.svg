<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect x="0" y="0" width="800" height="500" fill="#FFFDF7"/>

  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1F2A1B">position 四种定位值的参照系</text>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A5544">relative 参照原位 · absolute 参照定位祖先 · fixed 参照视口 · sticky 参照滚动容器</text>

  <text x="210" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#4A5544">relative：占位还在，盒子画到偏移处</text>
  <rect x="60" y="110" width="140" height="52" rx="4" fill="none" stroke="#8A7A55" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="130" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A7A55">原位置（虚线）</text>
  <rect x="100" y="142" width="140" height="52" rx="4" fill="#DCEBD4" stroke="#3F7A3F" stroke-width="1.5"/>
  <text x="170" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1F2A1B">top:32px left:40px</text>
  <text x="210" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">偏移的是"画的位置"，不腾出空间</text>

  <text x="590" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#4A5544">absolute：脱离文档流，挂在定位祖先上</text>
  <rect x="440" y="110" width="300" height="130" rx="4" fill="none" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="452" y="130" font-family="sans-serif" font-size="12" fill="#8A6A1F">position: relative 的祖先（参照）</text>
  <rect x="616" y="140" width="112" height="44" rx="4" fill="#DCEBD4" stroke="#3F7A3F" stroke-width="1.5"/>
  <text x="672" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1F2A1B">absolute 子元素</text>
  <text x="590" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">找不到定位祖先时，参照退化为整页</text>

  <text x="210" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#4A5544">fixed：参照视口，滚动也不动</text>
  <rect x="60" y="292" width="300" height="140" rx="4" fill="none" stroke="#4A5544" stroke-width="1.5"/>
  <text x="70" y="312" font-family="sans-serif" font-size="12" fill="#4A5544">视口</text>
  <rect x="288" y="386" width="60" height="36" rx="4" fill="#DCEBD4" stroke="#3F7A3F" stroke-width="1.5"/>
  <text x="318" y="408" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1F2A1B">fixed</text>
  <text x="210" y="452" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">注意：transform 祖先会抢走参照权</text>

  <text x="590" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#4A5544">sticky：先占位，越阈后钉在容器边缘</text>
  <rect x="440" y="292" width="300" height="140" rx="4" fill="none" stroke="#4A5544" stroke-width="1.5"/>
  <text x="450" y="312" font-family="sans-serif" font-size="12" fill="#4A5544">滚动容器</text>
  <rect x="450" y="320" width="110" height="32" rx="4" fill="#F6E6CC" stroke="#A7631D" stroke-width="1.5"/>
  <text x="505" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A6A1F">sticky 表头（占位）</text>
  <rect x="450" y="366" width="270" height="22" fill="#F1EFE4" rx="3"/>
  <rect x="450" y="396" width="270" height="22" fill="#F1EFE4" rx="3"/>
  <text x="590" y="452" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">必须写 top/bottom，且在父容器范围内钉住</text>

  <text x="400" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#8A6A1F">一句话结论：先问"参照谁"，再问"占不占位"——static/sticky 占位，absolute/fixed 脱离占位。</text>
</svg>
