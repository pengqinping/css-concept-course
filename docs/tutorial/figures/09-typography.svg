<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="410" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">文字的纵向度量剖面：基线与半行距</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#4A5544">20px 字、40px 行高：ascent 18px + descent 6px = 24px，上下各留 8px 半行距</text>

  <rect x="230" y="110" width="280" height="40" fill="#FBF0DE"/>
  <rect x="230" y="150" width="280" height="120" fill="#EAF0E4"/>
  <rect x="230" y="270" width="280" height="40" fill="#FBF0DE"/>

  <line x1="230" y1="110" x2="510" y2="110" stroke="#4A5544" stroke-width="1.2"/>
  <line x1="230" y1="150" x2="510" y2="150" stroke="#2F6F4F" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="230" y1="240" x2="510" y2="240" stroke="#4A5544" stroke-width="1.5"/>
  <line x1="230" y1="270" x2="510" y2="270" stroke="#2F6F4F" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="230" y1="310" x2="510" y2="310" stroke="#4A5544" stroke-width="1.2"/>
  <line x1="230" y1="110" x2="230" y2="310" stroke="#4A5544" stroke-width="1.2"/>
  <line x1="510" y1="110" x2="510" y2="310" stroke="#4A5544" stroke-width="1.2"/>

  <rect x="300" y="140" width="140" height="100" fill="none" stroke="#2F6F4F" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="370" y="100" text-anchor="middle" font-size="12" fill="#2F6F4F">em box（字号 20px）</text>
  <path d="M 318 240 L 348 168 L 378 240 M 328 214 L 368 214" fill="none" stroke="#1F2A1B" stroke-width="2"/>
  <circle cx="412" cy="216" r="21" fill="none" stroke="#1F2A1B" stroke-width="2"/>
  <path d="M 433 216 L 433 254 Q 433 267 421 267 Q 411 267 409 259" fill="none" stroke="#1F2A1B" stroke-width="2"/>

  <line x1="510" y1="110" x2="522" y2="110" stroke="#8A9384" stroke-width="1"/>
  <text x="528" y="114" font-size="12" fill="#4A5544">顶边（行盒上边界）</text>
  <line x1="510" y1="150" x2="522" y2="150" stroke="#2F6F4F" stroke-width="1"/>
  <text x="528" y="154" font-size="12" fill="#2F6F4F">字形上界 = ascender 18px</text>
  <line x1="510" y1="240" x2="522" y2="240" stroke="#4A5544" stroke-width="1"/>
  <text x="528" y="244" font-size="12" font-weight="700" fill="#1F2A1B">基线：多数字母坐落处</text>
  <line x1="510" y1="270" x2="522" y2="270" stroke="#2F6F4F" stroke-width="1"/>
  <text x="528" y="274" font-size="12" fill="#2F6F4F">字形下界 = descender 6px</text>
  <line x1="510" y1="310" x2="522" y2="310" stroke="#8A9384" stroke-width="1"/>
  <text x="528" y="314" font-size="12" fill="#4A5544">底边（行盒下边界）</text>

  <line x1="170" y1="112" x2="170" y2="308" stroke="#4A5544" stroke-width="1.5" marker-start="url(#arDark)" marker-end="url(#arDark)"/>
  <text x="150" y="204" text-anchor="end" font-size="14" font-weight="700" fill="#1F2A1B">行高 40px</text>
  <text x="150" y="222" text-anchor="end" font-size="12" fill="#4A5544">行盒高度，不是字高</text>

  <line x1="250" y1="114" x2="250" y2="146" stroke="#B26B00" stroke-width="1" marker-start="url(#arAmber)" marker-end="url(#arAmber)"/>
  <text x="262" y="134" font-size="12" fill="#A86A00">半行距 8px</text>
  <line x1="250" y1="274" x2="250" y2="306" stroke="#B26B00" stroke-width="1" marker-start="url(#arAmber)" marker-end="url(#arAmber)"/>
  <text x="262" y="294" font-size="12" fill="#A86A00">半行距 8px</text>

  <rect x="40" y="340" width="720" height="48" rx="5" fill="#FFFDF7" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="400" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">(40 − 24) ÷ 2 = 8px 上下半行距；基线距顶边 = 8 + 18 = 26px</text>
  <text x="400" y="382" text-anchor="middle" font-size="13" fill="#4A5544">字号 20px 描述字形大小，行高 40px 描述行盒高度——行高是行盒高度而非字高</text>
</svg>
