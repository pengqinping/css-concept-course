<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="580" fill="#F7F8F4"/>

  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">top layer 剖面：弹层在另一层，不与 z-index 比大小</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#4A5544">“盖得住”靠层级，不靠数值；尺寸与定位仍按原本的包含块计算</text>

  <!-- top layer -->
  <rect x="30" y="90" width="740" height="100" rx="6" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="46" y="116" font-size="14" font-weight="700" fill="#2F6F4F">top layer · 浏览器单开的一层</text>
  <text x="46" y="162" font-size="12" fill="#4A5544">绘制在全部常规内容之上</text>
  <text x="754" y="116" text-anchor="end" font-size="12" fill="#2F6F4F">不受祖先 overflow 裁剪</text>

  <rect x="350" y="104" width="175" height="70" rx="4" fill="#FFFFFF" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="437" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B" font-family="monospace">dialog · showModal()</text>
  <text x="437" y="148" text-anchor="middle" font-size="12" fill="#4A5544">背景 inert · 焦点圈定</text>
  <text x="437" y="166" text-anchor="middle" font-size="12" fill="#4A5544">Escape 可关闭</text>

  <rect x="545" y="104" width="205" height="70" rx="4" fill="#FFFFFF" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="647" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B" font-family="monospace">popover · popovertarget</text>
  <text x="647" y="148" text-anchor="middle" font-size="12" fill="#4A5544">轻关闭，不圈定焦点</text>
  <text x="647" y="166" text-anchor="middle" font-size="12" fill="#4A5544">背景仍可交互</text>

  <!-- 常规文档层 -->
  <rect x="30" y="210" width="740" height="290" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1.2"/>
  <text x="46" y="236" font-size="14" font-weight="700" fill="#1F2A1B">常规文档层</text>

  <rect x="70" y="255" width="300" height="210" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="85" y="279" font-size="12" fill="#4A5544">祖先 transform 新建层叠上下文</text>
  <rect x="95" y="295" width="130" height="48" rx="3" fill="#FFFFFF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="160" y="324" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">z-index: 9999</text>
  <line x1="160" y1="295" x2="160" y2="263" stroke="#B26B00" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arAmber)"/>
  <text x="235" y="322" font-size="12" fill="#B26B00">9999 出不去</text>
  <rect x="95" y="390" width="160" height="44" rx="4" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="175" y="418" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">触发：showModal()</text>
  <text x="85" y="455" font-size="12" fill="#4A5544">z-index 只在自己的上下文里比大小</text>

  <line x1="260" y1="388" x2="260" y2="196" stroke="#2F6F4F" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arGreen)"/>
  <text x="272" y="232" font-size="12" fill="#2F6F4F">触发 → 提升到 top layer</text>

  <rect x="400" y="255" width="340" height="210" rx="4" fill="none" stroke="#B26B00" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="414" y="279" font-size="12" fill="#B26B00">overflow: hidden 裁剪框</text>
  <rect x="420" y="300" width="150" height="56" rx="3" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="495" y="332" text-anchor="middle" font-size="12" fill="#1F2A1B">普通浮层 div</text>
  <line x1="572" y1="328" x2="598" y2="328" stroke="#B26B00" stroke-width="1.2" marker-end="url(#arAmber)"/>
  <rect x="600" y="300" width="170" height="56" rx="3" fill="none" stroke="#B26B00" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="685" y="332" text-anchor="middle" font-size="12" fill="#B26B00">被裁掉</text>
  <text x="414" y="392" font-size="12" fill="#2F6F4F">top layer 不受这圈裁剪</text>
  <text x="414" y="422" font-size="12" fill="#4A5544">但自身尺寸与定位仍按原包含块算</text>
  <text x="414" y="452" font-size="12" fill="#4A5544">position / inset / max-block-size 不能省</text>

  <rect x="30" y="515" width="740" height="55" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">::backdrop 遮罩只是样式；背景是否 inert 由 showModal() 决定</text>
  <text x="400" y="558" text-anchor="middle" font-size="12" fill="#4A5544">dialog[open] 不等于模态，模态认 :modal；popover 默认不是模态</text>
</svg>
