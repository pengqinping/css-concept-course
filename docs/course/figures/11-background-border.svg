<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" width="800" height="415" font-family="sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="415" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">多层背景剖面：先写的在上，背景色垫底</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#4A5544">从侧面剖开一个盒子：越靠上越靠近观察者；所有层被裁到同一条 background-clip 边界</text>

  <rect x="30" y="92" width="440" height="228" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="60" y="118" font-size="14" font-weight="700" fill="#1F2A1B">侧视剖面：绘制从下往上</text>

  <rect x="90" y="135" width="350" height="34" fill="#FBF0DE" stroke="#B26B00" stroke-width="1.2"/>
  <text x="100" y="157" font-size="12" fill="#7A5A12">边框（画在背景之上，半透明才看得见差异）</text>
  <rect x="90" y="175" width="350" height="38" fill="#DCE8D2" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="100" y="200" font-size="12" font-weight="700" fill="#1F2A1B">第一层 background-image（最上）</text>
  <rect x="90" y="219" width="350" height="38" fill="#E7EFDF" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="100" y="244" font-size="12" fill="#1F2A1B">第二层 background-image</text>
  <rect x="90" y="263" width="350" height="38" fill="#F1F5EA" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="100" y="288" font-size="12" fill="#1F2A1B">background-color（唯一，永远垫底）</text>

  <line x1="440" y1="130" x2="440" y2="307" stroke="#B26B00" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="452" y="319" text-anchor="end" font-size="12" fill="#A86A00">background-clip 边界：超出不绘制</text>
  <line x1="62" y1="292" x2="62" y2="184" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <text x="62" y="177" text-anchor="middle" font-size="12" fill="#4A5544">绘制 ↑</text>

  <rect x="490" y="92" width="280" height="228" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="504" y="118" font-size="14" font-weight="700" fill="#1F2A1B">background-clip 的三种绘制区域</text>

  <rect x="500" y="145" width="270" height="22" fill="#FBF0DE" stroke="#B26B00" stroke-width="1"/>
  <rect x="500" y="145" width="270" height="22" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1"/>
  <line x1="500" y1="145" x2="500" y2="167" stroke="#B26B00" stroke-width="2"/>
  <line x1="770" y1="145" x2="770" y2="167" stroke="#B26B00" stroke-width="2"/>
  <text x="500" y="184" font-size="12" fill="#1F2A1B">border-box（默认）：画到边框外沿</text>

  <rect x="500" y="205" width="270" height="22" fill="#FBF0DE" stroke="#B26B00" stroke-width="1"/>
  <rect x="516" y="205" width="238" height="22" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1"/>
  <line x1="500" y1="205" x2="500" y2="227" stroke="#B26B00" stroke-width="2"/>
  <line x1="770" y1="205" x2="770" y2="227" stroke="#B26B00" stroke-width="2"/>
  <text x="500" y="244" font-size="12" fill="#1F2A1B">padding-box：止于内边距外沿</text>

  <rect x="500" y="265" width="270" height="22" fill="#FBF0DE" stroke="#B26B00" stroke-width="1"/>
  <rect x="530" y="265" width="210" height="22" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1"/>
  <line x1="500" y1="265" x2="500" y2="287" stroke="#B26B00" stroke-width="2"/>
  <line x1="770" y1="265" x2="770" y2="287" stroke="#B26B00" stroke-width="2"/>
  <text x="500" y="304" font-size="12" fill="#1F2A1B">content-box：只覆盖内容</text>

  <rect x="40" y="338" width="720" height="56" rx="5" fill="#FFFDF7" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="400" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">层叠顺序、绘制区域、几何来源是三件独立的事，改动其中一个不影响另外两个</text>
  <text x="400" y="381" text-anchor="middle" font-size="13" fill="#4A5544">第一层 background-image 在最上，background-color 垫底；边框始终画在背景之上</text>
</svg>
