<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5544"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#F7F8F4"/>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1F2A1B">属性从流水线的哪一站进入，决定动画的代价</text>
  <text x="40" y="58" font-size="13" fill="#4A5544">前一站的输出是后一站的输入；单向依赖，改动落得越靠前，后面重做越多</text>

  <!-- 横向四站流水线 -->
  <rect x="60" y="105" width="150" height="80" rx="4" fill="#FFFDF7" stroke="#1F2A1B" stroke-width="1.2"/>
  <text x="135" y="145" font-size="16" font-weight="bold" fill="#1F2A1B" text-anchor="middle">样式计算</text>
  <text x="135" y="168" font-size="12" fill="#4A5544" text-anchor="middle">用哪个值</text>

  <rect x="245" y="105" width="150" height="80" rx="4" fill="#FFFDF7" stroke="#1F2A1B" stroke-width="1.2"/>
  <text x="320" y="145" font-size="16" font-weight="bold" fill="#1F2A1B" text-anchor="middle">布局</text>
  <text x="320" y="168" font-size="12" fill="#4A5544" text-anchor="middle">多大、放在哪</text>

  <rect x="430" y="105" width="150" height="80" rx="4" fill="#FFFDF7" stroke="#1F2A1B" stroke-width="1.2"/>
  <text x="505" y="145" font-size="16" font-weight="bold" fill="#1F2A1B" text-anchor="middle">绘制</text>
  <text x="505" y="168" font-size="12" fill="#4A5544" text-anchor="middle">画成像素指令</text>

  <rect x="615" y="105" width="125" height="80" rx="4" fill="#FFFDF7" stroke="#1F2A1B" stroke-width="1.2"/>
  <text x="677.5" y="145" font-size="16" font-weight="bold" fill="#1F2A1B" text-anchor="middle">合成</text>
  <text x="677.5" y="168" font-size="12" fill="#4A5544" text-anchor="middle">叠成画面</text>

  <line x1="210" y1="145" x2="243" y2="145" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>
  <line x1="395" y1="145" x2="428" y2="145" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>
  <line x1="580" y1="145" x2="613" y2="145" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>

  <!-- 三类属性注入不同阶段 -->
  <line x1="195" y1="300" x2="320" y2="187" stroke="#B26B00" stroke-width="1.5" marker-end="url(#arAmber)"/>
  <line x1="395" y1="300" x2="505" y2="187" stroke="#B26B00" stroke-width="1.5" marker-end="url(#arAmber)"/>
  <line x1="600" y1="300" x2="677" y2="187" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>

  <rect x="110" y="300" width="170" height="66" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="195" y="326" font-size="15" font-weight="bold" fill="#1F2A1B" text-anchor="middle">width / left</text>
  <text x="195" y="350" font-size="12" fill="#4A5544" text-anchor="middle">改尺寸/位置 → 重做布局</text>

  <rect x="300" y="300" width="190" height="66" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="395" y="326" font-size="15" font-weight="bold" fill="#1F2A1B" text-anchor="middle">background-color</text>
  <text x="395" y="350" font-size="12" fill="#4A5544" text-anchor="middle">不改几何 → 重做绘制</text>

  <rect x="500" y="300" width="200" height="66" rx="4" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="600" y="326" font-size="15" font-weight="bold" fill="#1F2A1B" text-anchor="middle">transform / opacity</text>
  <text x="600" y="350" font-size="12" fill="#4A5544" text-anchor="middle">条件满足时 → 仅合成</text>

  <rect x="60" y="400" width="680" height="46" rx="4" fill="#FFFDF7" stroke="#4A5544" stroke-width="1"/>
  <text x="400" y="422" font-size="13" fill="#1F2A1B" text-anchor="middle">任何属性变化都会重新算样式；真正拉开差距的是后面三站——改动落在越靠右的站，下游重做越少</text>

  <text x="545" y="477" font-size="14" fill="#4A5544" text-anchor="end">代价递减</text>
  <line x1="560" y1="472" x2="720" y2="472" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <text x="740" y="500" font-size="15" font-weight="bold" fill="#2F6F4F" text-anchor="end">越靠右，代价越小</text>
</svg>
