<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="440" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">从视口到组件：断点长在内容崩坏处</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#4A5544">先把浏览器拖窄、不加断点；内容开始拥挤的地方才是断点，设备名不是条件</text>
  <text x="40" y="94" font-size="12" fill="#4A5544">前提：meta viewport 建立有意义的布局视口（width=device-width），否则断点比的是假想的 980px</text>

  <rect x="40" y="106" width="210" height="64" rx="6" fill="#FFFDF7" stroke="#8A9384" stroke-width="1.2"/>
  <text x="145" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">① 内容开始拥挤</text>
  <text x="145" y="153" text-anchor="middle" font-size="12" fill="#4A5544">约 720px：标题三行、导航两排</text>
  <line x1="252" y1="138" x2="296" y2="138" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>

  <rect x="300" y="106" width="250" height="64" rx="6" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="425" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">② 在崩坏之前放 min-width 断点</text>
  <text x="425" y="153" text-anchor="middle" font-size="12" fill="#2F6F4F">46rem = 736px（移动优先，基础单列仍可用）</text>

  <path d="M 425 172 Q 300 196 150 236" fill="none" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <line x1="425" y1="172" x2="400" y2="236" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <path d="M 425 172 Q 550 196 650 236" fill="none" stroke="#B26B00" stroke-width="1.5" marker-end="url(#arAmber)"/>

  <rect x="40" y="240" width="220" height="112" rx="6" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="56" y="266" font-size="15" font-weight="700" fill="#1F2A1B">视口媒体查询</text>
  <text x="56" y="292" font-size="14" font-weight="700" fill="#2F6F4F">管：页面骨架</text>
  <text x="56" y="314" font-size="12" fill="#1F2A1B">导航、整体栅格、页边留白</text>
  <text x="56" y="336" font-size="12" fill="#4A5544">骨架跟着窗口走</text>

  <rect x="290" y="240" width="220" height="112" rx="6" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="306" y="266" font-size="15" font-weight="700" fill="#1F2A1B">容器查询（第 17 篇）</text>
  <text x="306" y="292" font-size="14" font-weight="700" fill="#2F6F4F">管：组件内部</text>
  <text x="306" y="314" font-size="12" fill="#1F2A1B">卡片在侧栏与主区的重排</text>
  <text x="306" y="336" font-size="12" fill="#4A5544">视口相同，可用宽度不同</text>

  <rect x="540" y="240" width="220" height="112" rx="6" fill="#FBF0DE" stroke="#B26B00" stroke-width="1.5"/>
  <text x="556" y="266" font-size="15" font-weight="700" fill="#1F2A1B">clamp()（第 18 篇）</text>
  <text x="556" y="292" font-size="14" font-weight="700" fill="#A86A00">管：连续尺度</text>
  <text x="556" y="314" font-size="12" fill="#1F2A1B">留白、字号</text>
  <text x="556" y="336" font-size="12" fill="#4A5544">要插值，不跳变</text>

  <rect x="40" y="374" width="720" height="52" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">问一句：这里变的是尺度、骨架，还是组件内部？</text>
  <text x="400" y="417" text-anchor="middle" font-size="13" fill="#4A5544">尺度连续变化交给 clamp()，结构跳变问视口，组件自己的空间变化问容器</text>
</svg>
