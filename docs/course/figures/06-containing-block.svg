<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <marker id="ruler" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7A3F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="460" fill="#F7F8F4"/>

  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1F2A1B">百分比是谁的百分比：两个参照盒</text>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A5544">同一个父元素、同一句 width:50%，定位方式一变，尺子就换</text>

  <text x="210" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">普通流子元素：参照父 content box</text>
  <rect x="50" y="120" width="300" height="180" fill="#EFE9DB" stroke="#8A7A55" stroke-width="1.2"/>
  <rect x="54" y="124" width="292" height="172" fill="#E4EBDD" stroke="#9CAD8C" stroke-width="1"/>
  <rect x="68" y="138" width="264" height="144" fill="#FFFDF7" stroke="#6B7F5B" stroke-width="1"/>
  <rect x="68" y="138" width="264" height="144" fill="none" stroke="#2F7A3F" stroke-width="2"/>
  <text x="200" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#2F7A3F">参照盒：content box = 400px</text>
  <rect x="68" y="180" width="140" height="44" fill="#DCEBD4" stroke="#3F7A3F" stroke-width="1.5"/>
  <text x="138" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">子元素 200px</text>
  <line x1="70" y1="248" x2="330" y2="248" stroke="#2F7A3F" stroke-width="1.3" marker-end="url(#ruler)"/>
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">400 × 50% = 200px</text>
  <text x="200" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">父：border 2 + padding 20 + content 400</text>

  <text x="590" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">绝对定位子元素：参照父 padding box</text>
  <rect x="430" y="120" width="300" height="180" fill="#EFE9DB" stroke="#8A7A55" stroke-width="1.2"/>
  <rect x="434" y="124" width="292" height="172" fill="#E4EBDD" stroke="#9CAD8C" stroke-width="1"/>
  <rect x="448" y="138" width="264" height="144" fill="#FFFDF7" stroke="#6B7F5B" stroke-width="1"/>
  <rect x="434" y="124" width="292" height="172" fill="none" stroke="#2F7A3F" stroke-width="2"/>
  <text x="590" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#2F7A3F">参照盒：padding box = 440px</text>
  <rect x="434" y="180" width="154" height="44" fill="#DCEBD4" stroke="#3F7A3F" stroke-width="1.5"/>
  <text x="511" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1F2A1B">子元素 220px</text>
  <line x1="436" y1="248" x2="728" y2="248" stroke="#2F7A3F" stroke-width="1.3" marker-end="url(#ruler)"/>
  <text x="582" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">(400 + 20×2) × 50% = 220px</text>
  <text x="580" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">父：position:relative；border 2px 不参与计算</text>

  <rect x="100" y="360" width="600" height="48" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="400" y="381" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#7A5A12">border 的 2px 始终在两把尺子之外</text>
  <text x="400" y="399" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">50% 没变，变的是尺子的起点与终点：普通流量 content box，绝对定位量 padding box</text>
</svg>
