<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="fork" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="560" fill="#F7F8F4"/>

  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1F2A1B">值的来源链：一个值进门的三种走法</text>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A5544">先看级联有没有选中，再看属性继不继承，最后才是初始值</text>

  <text x="40" y="94" font-family="sans-serif" font-size="14" font-weight="700" fill="#4A5544">默认路线</text>

  <rect x="40" y="130" width="170" height="90" rx="6" fill="#E7EADF" stroke="#7A846F" stroke-width="1.5"/>
  <text x="125" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">父元素计算值</text>
  <text x="125" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">color: #16794a</text>
  <text x="125" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">font-size: 16px</text>

  <rect x="280" y="100" width="200" height="60" rx="6" fill="#E8EFE1" stroke="#6B7F5B" stroke-width="1.5"/>
  <text x="380" y="124" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">继承属性</text>
  <text x="380" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">color / font / line-height</text>

  <rect x="550" y="100" width="210" height="60" rx="6" fill="#DCEBD4" stroke="#3F7A3F" stroke-width="1.5"/>
  <text x="655" y="124" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">子元素：继承到</text>
  <text x="655" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">复制父元素的计算值</text>

  <rect x="280" y="200" width="200" height="60" rx="6" fill="#EFE9DB" stroke="#8A7A55" stroke-width="1.5"/>
  <text x="380" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">非继承属性</text>
  <text x="380" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">border / width / margin</text>

  <rect x="550" y="200" width="210" height="60" rx="6" fill="#EFE9DB" stroke="#8A7A55" stroke-width="1.5"/>
  <text x="655" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">初始值</text>
  <text x="655" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">规范写死，如 border: none</text>

  <line x1="212" y1="160" x2="276" y2="130" stroke="#4A5544" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="212" y1="190" x2="276" y2="230" stroke="#4A5544" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="483" y1="130" x2="546" y2="130" stroke="#4A5544" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="483" y1="230" x2="546" y2="230" stroke="#4A5544" stroke-width="1.3" marker-end="url(#arrow)"/>

  <text x="400" y="296" font-family="sans-serif" font-size="14" font-weight="700" fill="#4A5544">全局关键字：强行改道（每个属性都能用）</text>

  <rect x="32" y="320" width="136" height="58" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="100" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#7A5A12">inherit</text>
  <text x="100" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">强制走继承</text>

  <rect x="182" y="320" width="136" height="58" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="250" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#7A5A12">initial</text>
  <text x="250" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">强制走初始值</text>

  <rect x="332" y="320" width="136" height="58" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="400" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#7A5A12">unset</text>
  <text x="400" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">按属性分流</text>

  <rect x="482" y="320" width="136" height="58" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="550" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#7A5A12">revert</text>
  <text x="550" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">退回更低来源</text>

  <rect x="632" y="320" width="136" height="58" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="700" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#7A5A12">revert-layer</text>
  <text x="700" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">退回上一个 @layer</text>

  <line x1="400" y1="378" x2="400" y2="392" stroke="#B8860B" stroke-width="1.2" marker-end="url(#fork)"/>
  <line x1="400" y1="392" x2="352" y2="392" stroke="#B8860B" stroke-width="1.2"/>
  <line x1="400" y1="392" x2="450" y2="392" stroke="#B8860B" stroke-width="1.2"/>
  <line x1="352" y1="392" x2="352" y2="406" stroke="#B8860B" stroke-width="1.2" marker-end="url(#fork)"/>
  <line x1="450" y1="392" x2="450" y2="406" stroke="#B8860B" stroke-width="1.2" marker-end="url(#fork)"/>
  <text x="352" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">继承属性 = inherit</text>
  <text x="450" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">非继承 = initial</text>

  <rect x="110" y="466" width="580" height="44" rx="6" fill="#EFE9DB" stroke="#8A7A55" stroke-width="1.2"/>
  <text x="400" y="485" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">同一个 unset：color 拿到父级绿色（继承），border 拿到 none（初始值）</text>
  <text x="400" y="502" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">revert 退回用户 / UA 样式，不是初始值；initial 才是规范默认值</text>
</svg>
