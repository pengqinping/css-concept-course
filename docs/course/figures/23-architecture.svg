<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" width="800" height="574" font-family="sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="574" fill="#F7F8F4"/>

  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">影响范围：一条规则能影响谁，逐层收窄</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#4A5544">越往外命中越多、改动风险越高；越往内边界越硬、越安全</text>

  <rect x="40" y="95" width="500" height="390" rx="8" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.5"/>
  <text x="56" y="122" font-size="14" font-weight="700" fill="#B26B00">① 全局层 · 标签选择器 p / a</text>
  <text x="56" y="142" font-size="12" fill="#4A5544">命中所有页面、第三方与未来内容</text>

  <rect x="70" y="165" width="440" height="295" rx="6" fill="#FFFDF7" stroke="#C9BFA6" stroke-width="1.2"/>
  <text x="86" y="192" font-size="14" font-weight="700" fill="#1F2A1B">② @layer · 把层叠顺序写成声明</text>
  <text x="86" y="212" font-size="12" fill="#4A5544">决定跨来源谁覆盖谁；未分层压过分层</text>

  <rect x="100" y="235" width="380" height="200" rx="6" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="116" y="262" font-size="14" font-weight="700" fill="#1F2A1B">③ 组件作用域 · .card__title</text>
  <text x="116" y="282" font-size="12" fill="#4A5544">或构建期哈希类名，只命中组件角色或单个实例</text>

  <rect x="130" y="305" width="320" height="105" rx="5" fill="#FFFFFF" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="146" y="332" font-size="14" font-weight="700" fill="#2F6F4F" font-family="monospace">④ 令牌 · --color-action</text>
  <text x="146" y="352" font-size="12" fill="#4A5544">原始值 → 语义令牌 → 组件接口</text>
  <text x="146" y="374" font-size="12" fill="#4A5544">只能向下引用；语义名不随换色矛盾</text>

  <text x="560" y="120" font-size="12" fill="#B26B00">外层：命中最多</text>
  <text x="560" y="200" font-size="12" fill="#4A5544">层顺序决定覆盖</text>
  <text x="560" y="270" font-size="12" fill="#2F6F4F">类名收窄命中</text>
  <text x="560" y="340" font-size="12" fill="#2F6F4F">换色只改令牌一行</text>
  <line x1="750" y1="120" x2="750" y2="458" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <text x="630" y="482" font-size="12" fill="#2F6F4F">影响范围逐层收窄</text>

  <rect x="40" y="500" width="720" height="62" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="525" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">两条轴共同决定波及范围：选择器命中范围 + 令牌引用方向</text>
  <text x="400" y="546" text-anchor="middle" font-size="12" fill="#4A5544">命名只收窄选择器的命中；继承值、全局规则与自定义属性仍会穿透</text>
</svg>
