<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5544"/>
    </marker>
  </defs>

  <rect width="800" height="690" fill="#F7F8F4"/>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1F2A1B">Grid：先画线，再定轨道，最后把项目放进格子</text>
  <text x="40" y="58" font-size="13" fill="#4A5544">三层叠加：① 网格线 → ② 轨道 → ③ 命名区域（顺序不可颠倒）</text>

  <!-- 第一层：网格线 -->
  <text x="60" y="90" font-size="14" font-weight="bold" fill="#1F2A1B">① 网格线：编号 1–4，是后面所有计算的坐标系</text>
  <line x1="160" y1="105" x2="160" y2="170" stroke="#1F2A1B" stroke-width="1.2"/>
  <line x1="300" y1="105" x2="300" y2="170" stroke="#1F2A1B" stroke-width="1.2"/>
  <line x1="450" y1="105" x2="450" y2="170" stroke="#1F2A1B" stroke-width="1.2"/>
  <line x1="740" y1="105" x2="740" y2="170" stroke="#1F2A1B" stroke-width="1.2"/>
  <text x="160" y="101" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">1</text>
  <text x="300" y="101" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">2</text>
  <text x="450" y="101" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">3</text>
  <text x="740" y="101" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">4</text>

  <line x1="90" y1="178" x2="90" y2="196" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>

  <!-- 第二层：轨道 -->
  <text x="60" y="208" font-size="14" font-weight="bold" fill="#1F2A1B">② 轨道：相邻两条线之间是一段轨道（容器宽 900px）</text>
  <rect x="160" y="222" width="140" height="64" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <text x="230" y="260" font-size="14" fill="#1F2A1B" text-anchor="middle">200px（固定）</text>
  <rect x="300" y="222" width="150" height="64" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <text x="375" y="251" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">1fr</text>
  <text x="375" y="271" font-size="13" fill="#4A5544" text-anchor="middle">= 220px</text>
  <rect x="450" y="222" width="290" height="64" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <text x="595" y="251" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">2fr</text>
  <text x="595" y="271" font-size="13" fill="#4A5544" text-anchor="middle">= 440px</text>
  <text x="160" y="306" font-size="13" fill="#4A5544">gap 20px × 2 = 40px（两道缝隙，先从容器宽里扣掉）</text>

  <rect x="60" y="320" width="680" height="42" rx="4" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <text x="400" y="340" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">1fr 计算顺序：容器宽 − 固定轨道 − gap − 最小尺寸 → 再按份额分</text>
  <text x="400" y="357" font-size="13" fill="#4A5544" text-anchor="middle">900 − 200 − 40 − 0 = 660 → 1fr = 660 ÷ 3 = 220px（三列 200 / 220 / 440）</text>

  <line x1="90" y1="368" x2="90" y2="386" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>

  <!-- 第三层：命名区域 -->
  <text x="60" y="400" font-size="14" font-weight="bold" fill="#1F2A1B">③ 命名区域：项目用 grid-area 对号入座，可跨格</text>
  <rect x="160" y="414" width="580" height="60" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="450" y="450" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">header（跨 3 列）</text>
  <rect x="160" y="474" width="140" height="120" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="230" y="534" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">side</text>
  <text x="230" y="552" font-size="12" fill="#4A5544" text-anchor="middle">跨 2 行</text>
  <rect x="300" y="474" width="440" height="120" fill="#FFFDF7" stroke="#1F2A1B" stroke-width="1.2"/>
  <text x="520" y="542" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">main（跨 2 行 × 2 列）</text>

  <line x1="160" y1="414" x2="160" y2="594" stroke="#4A5544" stroke-width="0.5"/>
  <line x1="300" y1="414" x2="300" y2="594" stroke="#4A5544" stroke-width="0.5"/>
  <line x1="450" y1="414" x2="450" y2="594" stroke="#4A5544" stroke-width="0.5"/>
  <line x1="740" y1="414" x2="740" y2="594" stroke="#4A5544" stroke-width="0.5"/>
  <line x1="160" y1="414" x2="740" y2="414" stroke="#4A5544" stroke-width="0.5"/>
  <line x1="160" y1="474" x2="740" y2="474" stroke="#4A5544" stroke-width="0.5"/>
  <line x1="160" y1="534" x2="740" y2="534" stroke="#4A5544" stroke-width="0.5"/>
  <line x1="160" y1="594" x2="740" y2="594" stroke="#4A5544" stroke-width="0.5"/>

  <text x="160" y="609" font-size="12" fill="#4A5544" text-anchor="middle">1</text>
  <text x="300" y="609" font-size="12" fill="#4A5544" text-anchor="middle">2</text>
  <text x="450" y="609" font-size="12" fill="#4A5544" text-anchor="middle">3</text>
  <text x="740" y="609" font-size="12" fill="#4A5544" text-anchor="middle">4</text>

  <rect x="60" y="628" width="680" height="40" rx="4" fill="#FFFDF7" stroke="#4A5544" stroke-width="1"/>
  <text x="400" y="653" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">线决定轨道，轨道决定区域；1fr 分的是扣除固定项、gap 与最小尺寸后的剩余空间</text>
</svg>
