<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#F7F8F4"/>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1F2A1B">同一个组件，查询容器不同，布局不同</text>
  <text x="40" y="60" font-size="13" fill="#4A5544">@media 管页面骨架（读视口宽）　/　@container 管组件内部（读最近查询容器宽）</text>

  <!-- 宽容器：两列 -->
  <rect x="60" y="100" width="300" height="300" rx="6" fill="#FFFDF7" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="75" y="125" font-size="15" font-weight="bold" fill="#2F6F4F">宽容器 700px（主区）</text>
  <rect x="85" y="160" width="250" height="190" rx="4" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="210" y="185" font-size="13" fill="#4A5544" text-anchor="middle">同一张卡片 · 代码完全相同</text>
  <rect x="98" y="200" width="90" height="130" fill="#FFFFFF" stroke="#2F6F4F" stroke-width="1"/>
  <text x="143" y="270" font-size="14" fill="#1F2A1B" text-anchor="middle">图</text>
  <text x="200" y="215" font-size="14" font-weight="bold" fill="#1F2A1B">标题</text>
  <text x="200" y="245" font-size="13" fill="#4A5544">正文第一行</text>
  <text x="200" y="267" font-size="13" fill="#4A5544">正文第二行</text>
  <text x="200" y="289" font-size="13" fill="#4A5544">…</text>
  <text x="210" y="337" font-size="14" font-weight="bold" fill="#2F6F4F" text-anchor="middle">满足断点 → 两列横排</text>

  <!-- 窄容器：单列 -->
  <rect x="440" y="100" width="300" height="300" rx="6" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.5"/>
  <text x="455" y="125" font-size="15" font-weight="bold" fill="#B26B00">窄容器 260px（侧栏）</text>
  <rect x="465" y="160" width="250" height="190" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="590" y="185" font-size="13" fill="#4A5544" text-anchor="middle">同一张卡片 · 代码完全相同</text>
  <rect x="480" y="200" width="220" height="60" fill="#FFFFFF" stroke="#B26B00" stroke-width="1"/>
  <text x="590" y="236" font-size="14" fill="#1F2A1B" text-anchor="middle">图</text>
  <text x="480" y="285" font-size="14" font-weight="bold" fill="#1F2A1B">标题</text>
  <text x="480" y="307" font-size="13" fill="#4A5544">正文…</text>
  <text x="480" y="329" font-size="13" fill="#4A5544">…</text>
  <text x="590" y="337" font-size="14" font-weight="bold" fill="#B26B00" text-anchor="middle">不满足 → 单列竖排</text>

  <!-- 中间：@container 断点 -->
  <rect x="280" y="415" width="240" height="52" rx="5" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="400" y="436" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">@container (min-width: 420px)</text>
  <text x="400" y="455" font-size="12" fill="#4A5544" text-anchor="middle">读离卡片最近的查询容器宽度</text>
  <text x="200" y="410" font-size="13" fill="#2F6F4F" text-anchor="middle">≥420px：两列</text>
  <line x1="330" y1="415" x2="260" y2="398" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <text x="600" y="410" font-size="13" fill="#B26B00" text-anchor="middle">&lt;420px：单列</text>
  <line x1="470" y1="415" x2="540" y2="398" stroke="#B26B00" stroke-width="1.5" marker-end="url(#arAmber)"/>

  <text x="400" y="495" font-size="14" fill="#1F2A1B" text-anchor="middle">视口始终是 1000px：@media 对两张卡片给出同一个答案，@container 读出 700px 与 260px</text>
</svg>
