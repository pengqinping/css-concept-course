<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="410" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">从色值到可读：对比度是关系，不是颜色属性</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#4A5544">空间决定调色是否可预测，关系决定可读性</text>

  <rect x="40" y="100" width="120" height="64" fill="#FFFFFF" stroke="#4A5544" stroke-width="1.5"/>
  <text x="100" y="180" text-anchor="middle" font-size="12" fill="#4A5544">背景 #fff · 亮度 1.00</text>
  <rect x="190" y="100" width="120" height="64" fill="#3f6b2a" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="250" y="180" text-anchor="middle" font-size="12" fill="#2F6F4F">文字 #3f6b2a · 亮度 0.118</text>

  <rect x="345" y="100" width="220" height="64" rx="5" fill="#FFFDF7" stroke="#8A9384" stroke-width="1"/>
  <text x="455" y="127" text-anchor="middle" font-size="14" fill="#1F2A1B">(较亮 + 0.05) ÷</text>
  <text x="455" y="150" text-anchor="middle" font-size="14" fill="#1F2A1B">(较暗 + 0.05)</text>

  <rect x="600" y="100" width="160" height="64" rx="5" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="680" y="134" text-anchor="middle" font-size="18" font-weight="700" fill="#2F6F4F">≈ 6.3:1</text>
  <text x="680" y="154" text-anchor="middle" font-size="12" fill="#4A5544">越过正文门槛</text>

  <line x1="162" y1="132" x2="186" y2="132" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="312" y1="132" x2="341" y2="132" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="567" y1="132" x2="596" y2="132" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>

  <text x="40" y="242" font-size="14" font-weight="700" fill="#1F2A1B">对比度门槛</text>
  <rect x="80" y="255" width="330" height="26" fill="#FBF0DE" stroke="#B26B00" stroke-width="1.2"/>
  <rect x="410" y="255" width="330" height="26" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.2"/>

  <line x1="269" y1="249" x2="269" y2="287" stroke="#B26B00" stroke-width="1"/>
  <text x="269" y="245" text-anchor="middle" font-size="12" fill="#A86A00">3:1 大字号 / 控件</text>
  <line x1="410" y1="249" x2="410" y2="287" stroke="#2F6F4F" stroke-width="1.5"/>
  <text x="410" y="300" text-anchor="middle" font-size="12" fill="#2F6F4F">4.5:1 正文门槛</text>

  <path d="M 572 246 L 588 246 L 580 255 z" fill="#B26B00"/>
  <text x="580" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#A86A00">本例 6.3:1</text>
  <text x="245" y="300" text-anchor="middle" font-size="12" fill="#A86A00">未达正文门槛（&lt; 4.5:1）</text>
  <text x="585" y="300" text-anchor="middle" font-size="12" fill="#2F6F4F">正文达标（≥ 4.5:1）</text>

  <rect x="40" y="335" width="720" height="54" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">对比度是比值：同一个绿放在白底约 6.3:1，换成浅绿底就掉下来</text>
  <text x="400" y="378" text-anchor="middle" font-size="13" fill="#4A5544">HSL 的 L 不是感知亮度，OKLCH 的 L 才对齐人眼；数值相等不等于可读性相同</text>
</svg>
