<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="480" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">状态变化的时间轴与层叠席位</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#4A5544">transition 靠事件给出前后两帧，animation 靠 @keyframes 写出整条时间轴；补出的值也参与层叠</text>

  <rect x="30" y="92" width="740" height="170" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="118" font-size="14" font-weight="700" fill="#1F2A1B">① transition 时间轴：事件发生后，在变化前计算值 A 与变化后计算值 B 之间补出中间值</text>

  <line x1="110" y1="175" x2="230" y2="175" stroke="#B26B00" stroke-width="2"/>
  <path d="M 230 175 C 380 175 440 125 590 125" fill="none" stroke="#2F6F4F" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="590" y1="125" x2="730" y2="125" stroke="#2F6F4F" stroke-width="2"/>
  <line x1="110" y1="125" x2="110" y2="225" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="230" y1="125" x2="230" y2="225" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="590" y1="125" x2="590" y2="225" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="225" x2="730" y2="225" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>

  <text x="108" y="168" text-anchor="middle" font-size="12" fill="#1F2A1B">A 变化前计算值</text>
  <text x="170" y="205" text-anchor="middle" font-size="12" fill="#A86A00">delay：先停在 A</text>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#2F6F4F">duration：插值区（如 300ms）</text>
  <text x="660" y="152" text-anchor="middle" font-size="12" fill="#1F2A1B">B 变化后计算值：稳定</text>
  <text x="110" y="243" text-anchor="middle" font-size="12" fill="#4A5544">事件触发</text>
  <text x="230" y="243" text-anchor="middle" font-size="12" fill="#4A5544">delay 结束</text>
  <text x="590" y="243" text-anchor="middle" font-size="12" fill="#4A5544">duration 结束</text>
  <text x="738" y="229" font-size="12" fill="#4A5544">时间 →</text>
  <text x="400" y="258" text-anchor="middle" font-size="12" fill="#4A5544">timing-function 把"时间进度"映射成"值进度"，补出一串中间值（如逐帧插值出的灰）</text>

  <rect x="30" y="278" width="740" height="137" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="304" font-size="14" font-weight="700" fill="#1F2A1B">② 层叠席位：从低到高，插值产生的值也有固定席位</text>

  <line x1="55" y1="408" x2="55" y2="320" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>

  <rect x="75" y="318" width="200" height="20" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="85" y="333" font-size="13" font-weight="700" fill="#1F2A1B">普通作者声明</text>
  <rect x="75" y="342" width="260" height="20" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="85" y="357" font-size="13" font-weight="700" fill="#1F2A1B">CSS 动画</text>
  <text x="345" y="357" font-size="12" fill="#2F6F4F">夹在普通声明和重要声明之间</text>
  <rect x="75" y="366" width="320" height="20" fill="#FBF0DE" stroke="#B26B00" stroke-width="1.2"/>
  <text x="85" y="381" font-size="13" font-weight="700" fill="#1F2A1B">作者 !important</text>
  <text x="405" y="381" font-size="12" fill="#A86A00">作者的重要声明压住动画值</text>
  <rect x="75" y="390" width="380" height="20" fill="#DCE8D2" stroke="#2F6F4F" stroke-width="2"/>
  <text x="85" y="405" font-size="13" font-weight="700" fill="#1F2A1B">CSS 过渡</text>
  <text x="462" y="405" font-size="14" fill="#4A5544">…</text>
  <text x="486" y="405" font-size="12" fill="#2F6F4F">高于所有重要声明：当前这一帧的即时期望</text>

  <rect x="40" y="430" width="720" height="44" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">当前这一帧的值，来自静态声明，还是插值？</text>
  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#4A5544">席位由机制规定，不能靠书写顺序挪动；给 .box 补 !important 会压住动画，却压不住过渡</text>
</svg>
