<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="580" fill="#F7F8F4"/>

  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">Shadow DOM 边界：哪条线能过去</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#4A5544">普通声明由外层胜出，!important 反转；只有列出的通道能过墙</text>

  <!-- 页面文档 -->
  <rect x="30" y="95" width="320" height="360" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="120" font-size="14" font-weight="700" fill="#1F2A1B">页面文档（外层）</text>

  <rect x="46" y="145" width="250" height="42" rx="3" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <text x="171" y="172" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">.card button</text>
  <line x1="298" y1="166" x2="338" y2="166" stroke="#B26B00" stroke-width="1.2" marker-end="url(#arAmber)"/>
  <line x1="340" y1="154" x2="340" y2="178" stroke="#B26B00" stroke-width="2"/>

  <rect x="46" y="225" width="250" height="42" rx="3" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <text x="171" y="252" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">button { color: red }</text>
  <line x1="298" y1="246" x2="338" y2="246" stroke="#B26B00" stroke-width="1.2" marker-end="url(#arAmber)"/>
  <line x1="340" y1="234" x2="340" y2="258" stroke="#B26B00" stroke-width="2"/>

  <rect x="46" y="305" width="250" height="42" rx="3" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <text x="171" y="332" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">:focus-visible</text>
  <line x1="298" y1="326" x2="338" y2="326" stroke="#B26B00" stroke-width="1.2" marker-end="url(#arAmber)"/>
  <line x1="340" y1="314" x2="340" y2="338" stroke="#B26B00" stroke-width="2"/>

  <text x="46" y="430" font-size="12" fill="#B26B00">普通选择器撞墙即止</text>

  <!-- 墙与关口 -->
  <rect x="352" y="95" width="16" height="360" fill="#EDEFE6" stroke="#4A5544" stroke-width="1.5"/>
  <text x="360" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#4A5544">:host 关口</text>

  <!-- 影子树 -->
  <rect x="380" y="95" width="390" height="360" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="396" y="120" font-size="14" font-weight="700" fill="#1F2A1B">影子树（内部）</text>

  <line x1="370" y1="166" x2="428" y2="166" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <rect x="430" y="145" width="320" height="42" rx="3" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="446" y="172" font-size="12" fill="#1F2A1B">CSS 变量 --accent：沿继承链进入</text>

  <line x1="370" y1="246" x2="428" y2="246" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <rect x="430" y="225" width="320" height="42" rx="3" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="446" y="252" font-size="12" fill="#1F2A1B">:host：从内部描述宿主默认样式</text>

  <line x1="370" y1="326" x2="428" y2="326" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <rect x="430" y="305" width="320" height="42" rx="3" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="446" y="332" font-size="12" fill="#1F2A1B" font-family="monospace">::part(action)：只命中标了 part 的节点</text>

  <rect x="430" y="370" width="320" height="48" rx="3" fill="#FFFFFF" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="590" y="392" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">button part=action</text>
  <text x="590" y="410" text-anchor="middle" font-size="12" fill="#4A5544" font-family="monospace">color: var(--accent)</text>
  <text x="396" y="440" font-size="12" fill="#4A5544">没标 part 的结构不可选；变量要内部 var() 消费</text>

  <!-- 状态时序 -->
  <rect x="30" y="475" width="740" height="95" rx="6" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="46" y="500" font-size="13" font-weight="700" fill="#1F2A1B">交互状态时序（优先级同为 (0,0,1,0)，同时命中时靠书写顺序裁决）</text>
  <rect x="60" y="515" width="170" height="38" rx="4" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="145" y="539" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">hover · 指针停住</text>
  <rect x="300" y="515" width="170" height="38" rx="4" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="385" y="539" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">focus-visible · 键盘</text>
  <rect x="540" y="515" width="170" height="38" rx="4" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="625" y="539" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">active · 按下期间</text>
  <line x1="232" y1="534" x2="298" y2="534" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <line x1="472" y1="534" x2="538" y2="534" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <text x="730" y="560" text-anchor="end" font-size="12" fill="#B26B00">disabled 放最后</text>
</svg>
