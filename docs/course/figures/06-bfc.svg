<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#F7F8F4"/>

  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1F2A1B">隔离边界：BFC 把内部影响关在门内</text>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A5544">两张图的盒子尺寸与 margin 数值完全相同，只差那一条边界</text>

  <text x="210" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">① parent 没有建立 BFC：margin 穿透</text>
  <line x1="60" y1="152" x2="360" y2="152" stroke="#A8B09C" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="210" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A9482">parent 上边缘本应在这里</text>
  <line x1="86" y1="158" x2="86" y2="200" stroke="#B8860B" stroke-width="1.5" marker-end="url(#down)"/>
  <text x="102" y="184" font-family="sans-serif" font-size="12" font-weight="600" fill="#8A6A1F">child margin-top: 50px</text>
  <rect x="60" y="204" width="300" height="120" fill="#E8E3D5" stroke="#8A7A55" stroke-width="1.5"/>
  <rect x="80" y="204" width="260" height="60" fill="#FFFDF7" stroke="#6B7F5B" stroke-width="1.5"/>
  <text x="210" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1F2A1B">child（顶部与 parent 齐平，无空隙）</text>
  <text x="352" y="313" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6B6352">parent（整体被推下 50px）</text>
  <text x="210" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A6A1F">折叠后的 50px 落在 parent 之外</text>

  <text x="590" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F2A1B">② parent { display: flow-root }：建立 BFC</text>
  <rect x="446" y="146" width="308" height="182" fill="none" stroke="#2F7A3F" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="600" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#2F7A3F">BFC 边界</text>
  <rect x="450" y="150" width="300" height="174" fill="#E8E3D5" stroke="#8A7A55" stroke-width="1.5"/>
  <rect x="470" y="150" width="260" height="54" fill="#F3EFE3" stroke="#B8860B" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="600" y="183" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A6A1F">50px 留在 parent 内部</text>
  <rect x="470" y="204" width="260" height="60" fill="#FFFDF7" stroke="#6B7F5B" stroke-width="1.5"/>
  <text x="600" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1F2A1B">child（被内部 margin 往下推）</text>
  <text x="742" y="313" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6B6352">parent（包住 child，本身不动）</text>
  <text x="590" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2F7A3F">折叠停在边界门口，parent 本身不动</text>

  <rect x="100" y="398" width="600" height="52" rx="6" fill="#FFFDF7" stroke="#B8860B" stroke-width="1.5"/>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#7A5A12">判断只问一句：这道边界在不在？</text>
  <text x="400" y="439" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A5544">不在，内部影响就会往外漏；border / padding 是另一种阻断机理（插进实体，不构成折叠条件）</text>
</svg>
