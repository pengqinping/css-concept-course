<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="430" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">表单状态时序：值说了什么，人做了什么</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#4A5544">把"当前值"和"用户是否已交互"分开：空的 required 在加载时就已经违反约束</text>

  <text x="30" y="108" font-size="12" font-weight="700" fill="#4A5544">伪类（触发条件）</text>
  <rect x="270" y="92" width="120" height="30" rx="4" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="330" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">页面加载</text>
  <rect x="460" y="92" width="120" height="30" rx="4" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="520" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">用户交互</text>
  <rect x="640" y="92" width="120" height="30" rx="4" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="700" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">失焦或提交</text>
  <line x1="392" y1="107" x2="456" y2="107" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="582" y1="107" x2="636" y2="107" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <line x1="270" y1="132" x2="770" y2="132" stroke="#4A5544" stroke-width="1.2" marker-end="url(#arDark)"/>
  <text x="770" y="86" text-anchor="end" font-size="12" fill="#4A5544">时间 →</text>
  <line x1="330" y1="136" x2="330" y2="340" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="520" y1="136" x2="520" y2="340" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="136" x2="700" y2="340" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="30" y="163" font-size="13" font-weight="700" fill="#2F6F4F" font-family="monospace">:invalid</text>
  <text x="30" y="182" font-size="12" fill="#4A5544">当前值不满足约束，加载即算</text>
  <line x1="270" y1="170" x2="770" y2="170" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="330" y="168" width="438" height="4" fill="#2F6F4F"/>

  <text x="30" y="203" font-size="13" font-weight="700" fill="#2F6F4F" font-family="monospace">:user-invalid</text>
  <text x="30" y="222" font-size="12" fill="#4A5544">交互并失焦后仍不满足约束</text>
  <line x1="270" y1="210" x2="770" y2="210" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="700" y="208" width="68" height="4" fill="#2F6F4F"/>

  <text x="30" y="243" font-size="13" font-weight="700" fill="#B26B00" font-family="monospace">:focus / :focus-visible</text>
  <text x="30" y="262" font-size="12" fill="#4A5544">获得焦点即亮 / 键盘启发式才亮</text>
  <line x1="270" y1="250" x2="770" y2="250" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="520" y="248" width="178" height="4" fill="#B26B00"/>

  <text x="30" y="283" font-size="13" font-weight="700" fill="#B26B00" font-family="monospace">:hover / :active</text>
  <text x="30" y="302" font-size="12" fill="#4A5544">悬停 / 按下期间；触屏通常不成立</text>
  <line x1="270" y1="290" x2="770" y2="290" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="520" y="288" width="118" height="4" fill="#B26B00"/>

  <text x="30" y="323" font-size="13" font-weight="700" fill="#2F6F4F" font-family="monospace">:checked / :indeterminate</text>
  <text x="30" y="342" font-size="12" fill="#4A5544">选中即亮 / 脚本设为 true 后亮</text>
  <line x1="270" y1="330" x2="770" y2="330" stroke="#A8B09C" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="520" y="328" width="248" height="4" fill="#2F6F4F"/>

  <rect x="40" y="358" width="720" height="60" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="383" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">触屏上不成立：:hover（没有悬停状态）、鼠标点击式 :focus-visible</text>
  <text x="400" y="405" text-anchor="middle" font-size="12" fill="#4A5544">悬停效果放进 (hover: hover) and (pointer: fine)；文本输入框的 :focus-visible 是例外，获得焦点通常即命中</text>
</svg>
