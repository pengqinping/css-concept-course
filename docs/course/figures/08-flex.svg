<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5544"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#F7F8F4"/>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1F2A1B">Flex：先定 basis，再扣 gap，再按系数分，最后受 min-size 约束</text>
  <text x="40" y="58" font-size="13" fill="#4A5544">上区：一维坐标　下区：剩余空间分配四步</text>

  <!-- 上区：主轴 / 交叉轴 / flex line -->
  <text x="120" y="88" font-size="14" font-weight="bold" fill="#1F2A1B">Flex 容器（display: flex）</text>
  <rect x="120" y="95" width="620" height="150" rx="4" fill="#FFFDF7" stroke="#1F2A1B" stroke-width="1.5"/>
  <rect x="135" y="112" width="590" height="85" fill="none" stroke="#4A5544" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="145" y="107" font-size="13" fill="#4A5544">flex line（一条主轴上的行）</text>

  <rect x="155" y="125" width="150" height="58" rx="3" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <text x="230" y="159" font-size="14" fill="#1F2A1B" text-anchor="middle">item 1</text>
  <rect x="335" y="125" width="150" height="58" rx="3" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <text x="410" y="159" font-size="14" fill="#1F2A1B" text-anchor="middle">item 2</text>
  <rect x="515" y="125" width="150" height="58" rx="3" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <text x="590" y="159" font-size="14" fill="#1F2A1B" text-anchor="middle">item 3</text>

  <text x="30" y="150" font-size="13" fill="#B26B00">交叉轴</text>
  <text x="30" y="168" font-size="12" fill="#B26B00">cross axis</text>
  <line x1="95" y1="195" x2="95" y2="125" stroke="#B26B00" stroke-width="1.5" marker-end="url(#arAmber)"/>

  <text x="430" y="214" font-size="13" fill="#2F6F4F" text-anchor="middle">主轴 main axis（flex-direction: row）</text>
  <line x1="140" y1="220" x2="720" y2="220" stroke="#2F6F4F" stroke-width="1.5" marker-end="url(#arGreen)"/>

  <!-- 下区：四步 -->
  <text x="40" y="285" font-size="15" font-weight="bold" fill="#1F2A1B">剩余空间分配四步（容器 600px）</text>

  <rect x="30" y="300" width="160" height="86" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <text x="110" y="325" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">① 定 basis</text>
  <text x="110" y="348" font-size="13" fill="#4A5544" text-anchor="middle">三项 basis</text>
  <text x="110" y="368" font-size="13" fill="#1F2A1B" text-anchor="middle">合计 300px</text>

  <rect x="230" y="300" width="160" height="86" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <text x="310" y="325" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">② 扣 gap</text>
  <text x="310" y="348" font-size="13" fill="#4A5544" text-anchor="middle">两处 gap</text>
  <text x="310" y="368" font-size="13" fill="#1F2A1B" text-anchor="middle">共 32px</text>

  <rect x="430" y="300" width="160" height="86" rx="4" fill="#FFFDF7" stroke="#1F2A1B" stroke-width="1"/>
  <text x="510" y="325" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">③ 算剩余</text>
  <text x="510" y="348" font-size="13" fill="#4A5544" text-anchor="middle">600−300−32</text>
  <text x="510" y="368" font-size="13" fill="#1F2A1B" text-anchor="middle">= 268px</text>

  <rect x="630" y="300" width="160" height="86" rx="4" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <text x="710" y="325" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">④ 按 grow 分</text>
  <text x="710" y="348" font-size="13" fill="#4A5544" text-anchor="middle">grow 2:1:1</text>
  <text x="710" y="368" font-size="13" fill="#1F2A1B" text-anchor="middle">134 / 67 / 67</text>

  <line x1="192" y1="343" x2="228" y2="343" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>
  <line x1="392" y1="343" x2="428" y2="343" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>
  <line x1="592" y1="343" x2="628" y2="343" stroke="#4A5544" stroke-width="1.5" marker-end="url(#arDark)"/>

  <!-- 最终宽度条：琥珀=basis，绿=grow 分到的剩余 -->
  <text x="40" y="415" font-size="14" font-weight="bold" fill="#1F2A1B">最终宽度（琥珀＝basis 固定值，绿＝grow 分到的剩余，白＝gap）</text>

  <rect x="70" y="430" width="110" height="64" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <rect x="180" y="430" width="147.4" height="64" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <rect x="327.4" y="430" width="17.6" height="64" fill="#FFFFFF" stroke="#4A5544" stroke-width="0.5" stroke-dasharray="3 2"/>
  <rect x="345" y="430" width="110" height="64" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <rect x="455" y="430" width="73.7" height="64" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>
  <rect x="528.7" y="430" width="17.6" height="64" fill="#FFFFFF" stroke="#4A5544" stroke-width="0.5" stroke-dasharray="3 2"/>
  <rect x="546.3" y="430" width="110" height="64" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <rect x="656.3" y="430" width="73.7" height="64" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1"/>

  <text x="125" y="467" font-size="13" fill="#1F2A1B" text-anchor="middle">100</text>
  <text x="253.7" y="467" font-size="13" fill="#1F2A1B" text-anchor="middle">+134</text>
  <text x="400" y="467" font-size="13" fill="#1F2A1B" text-anchor="middle">100</text>
  <text x="491.85" y="467" font-size="13" fill="#1F2A1B" text-anchor="middle">+67</text>
  <text x="601.3" y="467" font-size="13" fill="#1F2A1B" text-anchor="middle">100</text>
  <text x="693.15" y="467" font-size="13" fill="#1F2A1B" text-anchor="middle">+67</text>

  <text x="198.7" y="515" font-size="14" fill="#1F2A1B" text-anchor="middle">A: 100 + 134 = 234px</text>
  <text x="437" y="515" font-size="14" fill="#1F2A1B" text-anchor="middle">B: 100 + 67 = 167px</text>
  <text x="638" y="515" font-size="14" fill="#1F2A1B" text-anchor="middle">C: 100 + 67 = 167px</text>

  <rect x="30" y="540" width="740" height="40" rx="4" fill="#F8EEDF" stroke="#B26B00" stroke-width="1"/>
  <text x="400" y="565" font-size="14" font-weight="bold" fill="#1F2A1B" text-anchor="middle">最后受 min-size 约束：内容最小尺寸可能顶高某项，使其少分甚至不再增长</text>
</svg>
