<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <defs>
    <marker id="arDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5544"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#F7F8F4"/>

  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">四种看不见：布局、绘制、命中、层叠是四道不同的关</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#4A5544">display 管生成盒，visibility 管绘制，opacity 管像素与层叠，overflow 管越过盒的内容</text>

  <rect x="30" y="95" width="155" height="275" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <rect x="30" y="95" width="155" height="40" rx="6" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="107" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B" font-family="monospace">display: none</text>
  <line x1="107" y1="139" x2="107" y2="153" stroke="#4A5544" stroke-width="1" marker-end="url(#arDark)"/>
  <rect x="50" y="158" width="115" height="44" fill="none" stroke="#8A9384" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="107" y="186" text-anchor="middle" font-size="12" fill="#A86A00">无盒：占位也没了</text>
  <text x="40" y="240" font-size="12" fill="#4A5544">布局占位</text><text x="175" y="240" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">撤掉</text>
  <text x="40" y="262" font-size="12" fill="#4A5544">绘制像素</text><text x="175" y="262" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">撤掉</text>
  <text x="40" y="284" font-size="12" fill="#4A5544">命中点击</text><text x="175" y="284" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">撤掉</text>
  <text x="40" y="306" font-size="12" fill="#4A5544">层叠上下文</text><text x="175" y="306" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">无</text>
  <text x="40" y="336" font-size="12" fill="#4A5544">不生成盒；也从可访问性</text>
  <text x="40" y="354" font-size="12" fill="#4A5544">树移除，Tab 直接跳过</text>

  <rect x="225" y="95" width="155" height="275" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <rect x="225" y="95" width="155" height="40" rx="6" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="302" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B" font-family="monospace">visibility: hidden</text>
  <line x1="302" y1="139" x2="302" y2="153" stroke="#4A5544" stroke-width="1" marker-end="url(#arDark)"/>
  <rect x="245" y="158" width="115" height="44" fill="#FFFDF7" stroke="#8A9384" stroke-width="1"/>
  <rect x="265" y="170" width="75" height="20" fill="#FBF0DE" stroke="#B26B00" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="302" y="216" text-anchor="middle" font-size="12" fill="#4A5544">占位保留</text>
  <text x="235" y="240" font-size="12" fill="#4A5544">布局占位</text><text x="370" y="240" text-anchor="end" font-size="12" font-weight="700" fill="#2F6F4F">保留</text>
  <text x="235" y="262" font-size="12" fill="#4A5544">绘制像素</text><text x="370" y="262" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">撤掉</text>
  <text x="235" y="284" font-size="12" fill="#4A5544">命中点击</text><text x="370" y="284" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">撤掉</text>
  <text x="235" y="306" font-size="12" fill="#4A5544">层叠上下文</text><text x="370" y="306" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">无</text>
  <text x="235" y="336" font-size="12" fill="#4A5544">兄弟不补位；后代可改写</text>
  <text x="235" y="354" font-size="12" fill="#4A5544">visible 重新出现</text>

  <rect x="420" y="95" width="155" height="275" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <rect x="420" y="95" width="155" height="40" rx="6" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="497" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B" font-family="monospace">opacity: 0</text>
  <line x1="497" y1="139" x2="497" y2="153" stroke="#4A5544" stroke-width="1" marker-end="url(#arDark)"/>
  <rect x="440" y="158" width="115" height="44" fill="#FFFDF7" stroke="#8A9384" stroke-width="1"/>
  <rect x="460" y="170" width="75" height="20" fill="#FBF0DE" stroke="#B26B00" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="497" y="216" text-anchor="middle" font-size="12" fill="#4A5544">仍可命中</text>
  <text x="430" y="240" font-size="12" fill="#4A5544">布局占位</text><text x="565" y="240" text-anchor="end" font-size="12" font-weight="700" fill="#2F6F4F">保留</text>
  <text x="430" y="262" font-size="12" fill="#4A5544">绘制像素</text><text x="565" y="262" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">撤掉</text>
  <text x="430" y="284" font-size="12" fill="#4A5544">命中点击</text><text x="565" y="284" text-anchor="end" font-size="12" font-weight="700" fill="#2F6F4F">保留</text>
  <text x="430" y="306" font-size="12" fill="#4A5544">层叠上下文</text><text x="565" y="306" text-anchor="end" font-size="12" font-weight="700" fill="#2F6F4F">创建</text>
  <text x="430" y="336" font-size="12" fill="#4A5544">仍可 Tab 聚焦；整棵子树</text>
  <text x="430" y="354" font-size="12" fill="#4A5544">合成一张图，内外不穿插</text>

  <rect x="615" y="95" width="155" height="275" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <rect x="615" y="95" width="155" height="40" rx="6" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="692" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B" font-family="monospace">overflow: hidden</text>
  <line x1="692" y1="139" x2="692" y2="153" stroke="#4A5544" stroke-width="1" marker-end="url(#arDark)"/>
  <rect x="635" y="158" width="115" height="44" fill="#FFFDF7" stroke="#8A9384" stroke-width="1"/>
  <rect x="650" y="168" width="130" height="24" fill="#EAF0E4" stroke="#2F6F4F" stroke-width="1"/>
  <line x1="750" y1="156" x2="750" y2="204" stroke="#B26B00" stroke-width="2"/>
  <text x="692" y="216" text-anchor="middle" font-size="12" fill="#4A5544">裁掉超出部分</text>
  <text x="625" y="240" font-size="12" fill="#4A5544">布局占位</text><text x="760" y="240" text-anchor="end" font-size="12" font-weight="700" fill="#2F6F4F">保留</text>
  <text x="625" y="262" font-size="12" fill="#4A5544">绘制像素</text><text x="760" y="262" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">超出裁</text>
  <text x="625" y="284" font-size="12" fill="#4A5544">命中点击</text><text x="760" y="284" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">超出裁</text>
  <text x="625" y="306" font-size="12" fill="#4A5544">层叠上下文</text><text x="760" y="306" text-anchor="end" font-size="12" font-weight="700" fill="#A86A00">无</text>
  <text x="625" y="336" font-size="12" fill="#4A5544">仍是滚动容器；建立的</text>
  <text x="625" y="354" font-size="12" fill="#4A5544">是 BFC，不是层叠上下文</text>

  <rect x="40" y="390" width="720" height="50" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A1B">CSS 没有一条属性能同时回答这四个问题；调试顺序：盒还在不在 → 像素画没画 → 命中区域在不在</text>
  <text x="400" y="433" text-anchor="middle" font-size="12" fill="#4A5544">从布局到像素由深到浅，越靠后越不易让周围元素跳动；opacity: 0 不是最终隐藏</text>
</svg>
