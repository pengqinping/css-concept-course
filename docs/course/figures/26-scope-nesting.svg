<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F4F"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B26B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="560" fill="#F7F8F4"/>

  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A1B">@scope 圈子树，:has() 反向选父：两者都不隔离样式</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#4A5544">同一棵 DOM 树画两遍：变的是参与匹配的子树与匹配箭头的方向</text>

  <!-- 左：@scope -->
  <rect x="30" y="85" width="360" height="400" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="46" y="112" font-size="15" font-weight="700" fill="#2F6F4F">@scope：圈定子树的边界</text>
  <rect x="60" y="140" width="300" height="310" fill="#F7F8F4" stroke="#C8CEBF" stroke-width="1"/>
  <rect x="90" y="160" width="240" height="44" rx="3" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="210" y="188" text-anchor="middle" font-size="12" fill="#1F2A1B">.card（根，包含在内）</text>

  <rect x="80" y="225" width="260" height="205" rx="4" fill="none" stroke="#2F6F4F" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="90" y="219" font-size="12" fill="#2F6F4F" font-family="monospace">@scope (.card) to (figure)</text>

  <rect x="100" y="245" width="110" height="44" rx="3" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="1.2"/>
  <text x="155" y="273" text-anchor="middle" font-size="12" fill="#1F2A1B">p · 命中</text>
  <rect x="230" y="245" width="100" height="44" rx="3" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="280" y="273" text-anchor="middle" font-size="12" fill="#1F2A1B">figure · 下限</text>
  <rect x="230" y="330" width="100" height="44" rx="3" fill="#FFFDF7" stroke="#B26B00" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#1F2A1B">p · 排除</text>

  <line x1="155" y1="204" x2="155" y2="243" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <text x="166" y="230" font-size="12" fill="#2F6F4F">范围内参与匹配</text>
  <path d="M 90 204 L 90 352 L 228 352" fill="none" stroke="#B26B00" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arAmber)"/>
  <text x="100" y="390" font-size="12" fill="#B26B00">继承属性照穿下限，不是沙箱</text>
  <text x="46" y="462" font-size="12" fill="#4A5544">范围：只限定哪些元素参与匹配</text>
  <text x="46" y="480" font-size="12" fill="#4A5544">优先级仍照算，近根者胜出</text>

  <!-- 右：:has() -->
  <rect x="410" y="85" width="360" height="400" rx="6" fill="#FFFDF7" stroke="#C8CEBF" stroke-width="1"/>
  <text x="426" y="112" font-size="15" font-weight="700" fill="#B26B00">:has()：从后代反向命中父级</text>
  <rect x="440" y="140" width="300" height="310" fill="#F7F8F4" stroke="#C8CEBF" stroke-width="1"/>
  <rect x="470" y="160" width="240" height="44" rx="3" fill="#E8F1E9" stroke="#2F6F4F" stroke-width="2"/>
  <text x="590" y="188" text-anchor="middle" font-size="12" fill="#1F2A1B">.card（被反向选中）</text>
  <rect x="480" y="245" width="110" height="44" rx="3" fill="#EDEFE6" stroke="#8A9384" stroke-width="1"/>
  <text x="535" y="273" text-anchor="middle" font-size="12" fill="#1F2A1B">p</text>
  <rect x="605" y="245" width="120" height="44" rx="3" fill="#F8EEDF" stroke="#B26B00" stroke-width="1.2"/>
  <text x="665" y="273" text-anchor="middle" font-size="12" fill="#1F2A1B" font-family="monospace">button:disabled</text>

  <line x1="665" y1="243" x2="665" y2="206" stroke="#2F6F4F" stroke-width="1.2" marker-end="url(#arGreen)"/>
  <text x="470" y="230" font-size="12" fill="#2F6F4F" font-family="monospace">:has(button:disabled)</text>
  <text x="426" y="462" font-size="12" fill="#4A5544">方向：条件反向；DOM 一动不动</text>
  <text x="426" y="480" font-size="12" fill="#4A5544">优先级取括号内参数最高的一项</text>

  <rect x="30" y="500" width="740" height="52" rx="5" fill="#FFFDF7" stroke="#B26B00" stroke-width="1.2"/>
  <text x="400" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A1B">原生嵌套编译后仍是 .card button 这样的扁平选择器</text>
  <text x="400" y="544" text-anchor="middle" font-size="12" fill="#4A5544">三者都不改 DOM、都不隔离样式，也都不免掉层叠关卡</text>
</svg>
